archetype_packs:
  content:
    file: rules/archetypes/content.md
    id: content
    default_modules:
      - ux
      - tokens
      - responsive
      - animation
      - accessibility
      - performance
      - security
    conditional_modules:
      - states
      - architecture
      - forms
      - i18n
  commerce:
    file: rules/archetypes/commerce.md
    id: commerce
    default_modules:
      - ux
      - states
      - forms
      - tokens
      - responsive
      - animation
      - architecture
      - mutations
      - search
      - notifications
      - accessibility
      - performance
      - security
    conditional_modules:
      - i18n
  application:
    file: rules/archetypes/application.md
    id: application
    default_modules:
      - ux
      - states
      - forms
      - tokens
      - responsive
      - data-density
      - animation
      - architecture
      - mutations
      - search
      - notifications
      - accessibility
      - performance
      - security
      - ai-enforcement
    conditional_modules:
      - i18n
  auth:
    file: rules/archetypes/auth.md
    id: auth
    default_modules:
      - ux
      - states
      - forms
      - tokens
      - responsive
      - animation
      - architecture
      - mutations
      - notifications
      - accessibility
      - performance
      - security
    conditional_modules:

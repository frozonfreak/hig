framework_adapters:
  react:
    file: framework/react.md
    triggers: [react, jsx, tsx, use client]
  next:
    file: framework/next.md
    triggers: [next.js, nextjs, app router, server action]
    extends: react
  vue:
    file: framework/vue.md
    triggers: [vue, vue 3, .vue]
  nuxt:
    file: framework/nuxt.md
    triggers: [nuxt, nuxt 3]
    extends: vue
  astro:
    file: framework/astro.md
    triggers: [astro, .astro, client:load, client:visible]

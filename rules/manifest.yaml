# Modern Web HIG — Progressive loading manifest
# Version: 1.9.0
# Human-readable index: rules/INDEX.md

version: "1.9.0"

levels:
  0:
    file: HIG-CORE.md
    description: Philosophy, vocabulary, archetypes, simplicity rule
    load: session_start
  1:
    file: HIG-LITE.md
    description: Default daily agent context — compressed executable summary
    load: all_ui_tasks
  2:
    file: rules/
    description: Topic-triggered standalone rule modules
    load: on_topic_match
  3:
    file: HIG.md
    description: Complete normative specification
    load: edge_cases_and_conflicts


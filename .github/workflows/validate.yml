name: Validate HIG

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate contract, Markdown links, and rule IDs
        run: npm run validate
      - name: Test installer
        run: npm test
      - name: Documentation site artifacts
        run: npm run build:docs
      - name: Version bump rules
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run check:version-bump
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown and HTML link targets
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --config lychee.toml
            --offline
            --verbose
            --no-progress
            --root-dir .
            '**/*.md'
            'docs/**/*.html'
